name: Private Agent Gateway integration
on:
  push:
    branches: [main, 'codex/**']
    paths: ['services/agent-gateway/**', 'services/langflow/gateway_components.py', 'services/langflow/overtourism_components.py', 'services/jeju-mcp/**', 'deploy/**', '.github/workflows/agent-gateway-docker.yml']
  pull_request:
    paths: ['services/agent-gateway/**', 'services/langflow/gateway_components.py', 'services/langflow/overtourism_components.py', 'services/jeju-mcp/**', 'deploy/**', '.github/workflows/agent-gateway-docker.yml']
permissions:
  contents: read
concurrency:
  group: agent-gateway-${{ github.ref }}
  cancel-in-progress: true
jobs:
  private-gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: oreumit-gateway-ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with: {node-version: '24.22.1'}
      - name: Install locked MCP dependencies for real scope tests
        run: npm --prefix services/jeju-mcp ci --ignore-scripts --no-audit --no-fund
      - name: Verify auth, replay, scope policy, response validation and secret preservation
        run: |
          node --test services/agent-gateway/*.test.mjs services/jeju-mcp/tests/gateway-scopes.test.mjs services/jeju-mcp/tests/overtourism.test.mjs
          python3 -m unittest discover -s deploy/tests
          python3 -m unittest discover -s deploy/tunnel -p 'test_*.py'
      - name: Prepare private credentials and fictional catalog
        run: |
          python3 deploy/prepare.py
          python3 deploy/prepare-langflow.py
          node deploy/tests/make-ci-catalog.mjs
          python3 deploy/prepare-gateway.py --init
      - name: Start official Langflow and scoped MCP with dedicated database
        run: docker compose -f deploy/compose.yaml -f deploy/compose.catalog.yaml -f deploy/compose.langflow.yaml -f deploy/compose.gateway.yaml up -d --build --wait --wait-timeout 300 jeju-mcp langflow-db langflow
      - name: Check installed candidate recovery without live scopes or model inference
        run: docker compose -f deploy/compose.yaml -f deploy/compose.catalog.yaml -f deploy/compose.langflow.yaml -f deploy/compose.gateway.yaml exec -T jeju-mcp node --input-type=module - < deploy/tests/check-candidate-recovery.mjs
      - name: Check the installed minimal-walk route rule (the fictional catalog has no route places)
        run: docker compose -f deploy/compose.yaml -f deploy/compose.catalog.yaml -f deploy/compose.langflow.yaml -f deploy/compose.gateway.yaml exec -T jeju-mcp node --input-type=module - < deploy/tests/check-walk-route.mjs
      - name: Provision separate fixed Gateway flow and capture its key privately
        run: |
          docker compose -f deploy/compose.yaml -f deploy/compose.catalog.yaml -f deploy/compose.langflow.yaml -f deploy/compose.gateway.yaml exec -T -e CI=true langflow python - < deploy/tests/seed-gateway-ci.py
          python3 deploy/prepare-gateway.py --provision
          python3 deploy/prepare-gateway.py --provision
      - name: Start private Gateway and check authentication and upstream readiness
        run: |
          docker compose -f deploy/compose.yaml -f deploy/compose.catalog.yaml -f deploy/compose.langflow.yaml -f deploy/compose.gateway.yaml up -d --build --no-deps --wait --wait-timeout 90 agent-gateway
          docker compose -f deploy/compose.yaml -f deploy/compose.catalog.yaml -f deploy/compose.langflow.yaml -f deploy/compose.gateway.yaml exec -T agent-gateway node /app/check.mjs --internal
      - name: Test real scoped Langflow components without model inference
        run: python3 deploy/tests/run-gateway-runtime-check.py
      - name: Check queue state against installed modules with host tests over stdin
        run: |
          for test_file in state jobs; do
            docker compose -f deploy/compose.yaml -f deploy/compose.catalog.yaml -f deploy/compose.langflow.yaml -f deploy/compose.gateway.yaml exec -T --workdir /app agent-gateway node --input-type=module - < "services/agent-gateway/${test_file}.test.mjs"
          done
      - name: Verify Gateway restart preserves private state and pinned flow
        run: |
          docker compose -f deploy/compose.yaml -f deploy/compose.catalog.yaml -f deploy/compose.langflow.yaml -f deploy/compose.gateway.yaml restart agent-gateway
          docker compose -f deploy/compose.yaml -f deploy/compose.catalog.yaml -f deploy/compose.langflow.yaml -f deploy/compose.gateway.yaml up -d --no-deps --wait --wait-timeout 60 agent-gateway
          docker compose -f deploy/compose.yaml -f deploy/compose.catalog.yaml -f deploy/compose.langflow.yaml -f deploy/compose.gateway.yaml exec -T agent-gateway node /app/check.mjs --internal
      - name: Switch the stored flow to 4 calls and back to 8 in place, with fake-model agent checks
        run: |
          compose="docker compose -f deploy/compose.yaml -f deploy/compose.catalog.yaml -f deploy/compose.langflow.yaml -f deploy/compose.gateway.yaml"
          $compose exec -T -e CI=true langflow python - --expect 8 < deploy/tests/check-gateway-call-budget.py
          python3 deploy/prepare-gateway.py --check-flow
          python3 deploy/prepare-gateway.py --rollback-flow
          $compose up -d --no-deps --force-recreate --wait --wait-timeout 90 agent-gateway
          $compose exec -T agent-gateway node /app/check.mjs --internal
          $compose exec -T -e CI=true langflow python - --expect 4 < deploy/tests/check-gateway-call-budget.py
          python3 deploy/prepare-gateway.py --update-flow
          python3 deploy/prepare-gateway.py --update-flow
          $compose up -d --no-deps --force-recreate --wait --wait-timeout 90 agent-gateway
          $compose exec -T agent-gateway node /app/check.mjs --internal
          python3 deploy/prepare-gateway.py --check-flow
          $compose exec -T -e CI=true langflow python - --expect 8 < deploy/tests/check-gateway-call-budget.py
          # The switch marker stays until the re-pinned Gateway passes; clearing it is explicit.
          python3 deploy/prepare-gateway.py --flow-change-pending
          python3 deploy/prepare-gateway.py --complete-flow-change
          pending=0
          python3 deploy/prepare-gateway.py --flow-change-pending || pending=$?
          test "$pending" = 3
      - name: Switch to the rule-action OpenAI flow and back in place, with offline composition and client checks
        run: |
          compose="docker compose -f deploy/compose.yaml -f deploy/compose.catalog.yaml -f deploy/compose.langflow.yaml -f deploy/compose.gateway.yaml"
          $compose exec -T jeju-mcp node --input-type=module - < deploy/tests/check-rule-action.mjs
          # Langflow allows 5 logins per minute; each prepare-gateway flow mode and
          # each CI check below logs in once. Wait out the previous step's logins.
          sleep 61
          # Without the OpenAI credential the switch is refused before any flow PATCH and leaves no marker.
          refused=0
          output=$(python3 deploy/prepare-gateway.py --rule-action-flow) || refused=$?
          test "$refused" = 1
          printf '%s' "$output" | python3 -c 'import json,sys; assert json.load(sys.stdin)["code"] == "GATEWAY_CREDENTIAL_UNAVAILABLE"'
          pending=0
          python3 deploy/prepare-gateway.py --flow-change-pending || pending=$?
          test "$pending" = 3
          $compose exec -T -e CI=true langflow python - < deploy/tests/seed-openai-ci.py
          python3 deploy/prepare-gateway.py --rule-action-flow
          python3 deploy/prepare-gateway.py --rule-action-flow
          $compose up -d --no-deps --force-recreate --wait --wait-timeout 90 agent-gateway
          $compose exec -T agent-gateway node /app/check.mjs --internal
          python3 deploy/prepare-gateway.py --check-rule-action-flow
          sleep 61
          $compose exec -T -e CI=true langflow python - --expect 8 < deploy/tests/check-gateway-call-budget.py
          $compose exec -T -e CI=true langflow python - < deploy/tests/check-openai-client.py
          python3 deploy/prepare-gateway.py --rule-action-rollback-flow
          $compose up -d --no-deps --force-recreate --wait --wait-timeout 90 agent-gateway
          $compose exec -T agent-gateway node /app/check.mjs --internal
          python3 deploy/prepare-gateway.py --check-flow
          python3 deploy/prepare-gateway.py --complete-flow-change
      - name: Provision the overtourism diagnosis flow, pin it in the Gateway and run its real components without a model
        run: |
          compose="docker compose -f deploy/compose.yaml -f deploy/compose.catalog.yaml -f deploy/compose.langflow.yaml -f deploy/compose.gateway.yaml"
          $compose exec -T jeju-mcp node --input-type=module - < deploy/tests/check-overtourism.mjs
          # Without a pin the route is unavailable and recommendations are unchanged.
          $compose exec -T agent-gateway node /app/check.mjs --internal
          missing=0
          $compose exec -T agent-gateway node /app/check.mjs --internal --overtourism || missing=$?
          test "$missing" = 1
          # Langflow allows 5 logins per minute; each bootstrap run logs in once.
          sleep 61
          python3 deploy/prepare-overtourism.py --provision
          python3 deploy/prepare-overtourism.py --provision
          python3 deploy/prepare-overtourism.py --check
          $compose up -d --no-deps --force-recreate --wait --wait-timeout 90 agent-gateway
          $compose exec -T agent-gateway node /app/check.mjs --internal --overtourism
          $compose exec -T agent-gateway node /app/check.mjs --internal
          python3 deploy/prepare-gateway.py --check-flow
          python3 deploy/tests/run-overtourism-runtime-check.py
          python3 deploy/prepare-overtourism.py --disable
          $compose up -d --no-deps --force-recreate --wait --wait-timeout 90 agent-gateway
          $compose exec -T agent-gateway node /app/check.mjs --internal
      - name: Switch Langflow message storage on and off in place, run the stored flow without a model and count kept messages
        run: |
          compose="docker compose -f deploy/compose.yaml -f deploy/compose.catalog.yaml -f deploy/compose.langflow.yaml -f deploy/compose.gateway.yaml"
          # Langflow allows 5 logins per minute from one address. Each prepare-gateway flow mode and each
          # message check below logs in once (check.mjs and the marker modes do not), so each of the three
          # blocks between the waits logs in three times, below the limit with room to spare.
          sleep 61
          # A new provision stores the 8-call build without Chat Input/Output message storage. The CI Vertex
          # credential is a placeholder, so each run ends in Langflow's error message before any provider call.
          python3 deploy/prepare-gateway.py --check-message-store-off-flow
          python3 deploy/tests/run-gateway-message-store-check.py --expect-not-stored
          python3 deploy/prepare-gateway.py --message-store-on-flow
          $compose up -d --no-deps --force-recreate --wait --wait-timeout 90 agent-gateway
          $compose exec -T agent-gateway node /app/check.mjs --internal
          sleep 61
          python3 deploy/prepare-gateway.py --check-message-store-on-flow
          python3 deploy/tests/run-gateway-message-store-check.py --expect-stored
          python3 deploy/prepare-gateway.py --message-store-off-flow
          $compose up -d --no-deps --force-recreate --wait --wait-timeout 90 agent-gateway
          $compose exec -T agent-gateway node /app/check.mjs --internal
          sleep 61
          python3 deploy/prepare-gateway.py --check-message-store-off-flow
          # The build switches keep the storage setting: the stored 8-call flow still passes its own check.
          python3 deploy/prepare-gateway.py --check-flow
          python3 deploy/tests/run-gateway-message-store-check.py --expect-not-stored
          python3 deploy/prepare-gateway.py --complete-flow-change
          pending=0
          python3 deploy/prepare-gateway.py --flow-change-pending || pending=$?
          test "$pending" = 3
      - name: Run the read-only metrics and message-store check SQL and the redaction dry run and execute on the disposable Langflow DB
        run: |
          compose="docker compose -f deploy/compose.yaml -f deploy/compose.catalog.yaml -f deploy/compose.langflow.yaml"
          $compose exec -T langflow-db sh -eu -c 'PGPASSWORD="$LANGFLOW_DB_PASSWORD" psql -h 127.0.0.1 -U langflow_app -d langflow -P pager=off -v ON_ERROR_STOP=1' < deploy/agent-run-metrics.sql
          # The check's boundary is the last flow change: the final --message-store-off-flow above. Only the
          # last message check ran after it, and the placeholder Vertex credential ends that run in one lfx error
          # message; the store-on run before it stored its request message. No run reaches final validation, so
          # [4] can judge nothing and, with nothing stored after the boundary, leaves passed empty: f and ''.
          # Run counts are not asserted: lfx flushes an error run's trace in a background task. psql does not
          # log into Langflow.
          $compose exec -T langflow-db sh -eu -c 'PGPASSWORD="$LANGFLOW_DB_PASSWORD" psql -h 127.0.0.1 -U langflow_app -d langflow -P pager=off -v ON_ERROR_STOP=1' < deploy/agent-message-store-check.sql
          $compose exec -T langflow-db sh -eu -c 'PGPASSWORD="$LANGFLOW_DB_PASSWORD" psql -h 127.0.0.1 -U langflow_app -d langflow -q -A -t -v ON_ERROR_STOP=1' < deploy/agent-message-store-check.sql > "$RUNNER_TEMP/message-store-check.txt"
          python3 - "$RUNNER_TEMP/message-store-check.txt" <<'PY'
          import sys
          sections, current = {}, None
          for line in open(sys.argv[1], encoding='utf-8').read().splitlines():
              if line.startswith('[') and '] ' in line:
                  current = line.split(']', 1)[0] + ']'
                  sections[current] = []
              elif line:
                  sections[current].append(line.split('|'))
          (flows, changed_at), = sections['[1]']
          # [2] rows: after_flow_change | runs | accepted | blocked | agent_error | no_final | redacted
          periods = [row[0] for row in sections['[2]']]
          # [3] rows: after_flow_change | messages | stored_messages | error_messages | sessions_with_stored_message
          messages = {row[0]: [int(value) for value in row[1:]] for row in sections['[3]']}
          assert sections['[0]'] == [['UTC']] and flows == '1' and changed_at and periods == ['t', 'f'], sections
          assert [row[0] for row in sections['[3]']] == ['t', 'f'], sections
          after, before = messages['t'], messages['f']
          assert after[1] == 0 and after[3] == 0 and after[2] >= 1 and before[1] >= 1, sections
          assert sections['[4]'] == [['f', '']], sections
          print({'flows': 1, 'storedAfter': after[1], 'errorMessagesAfter': after[2], 'storedBefore': before[1],
                 'canJudge': sections['[4]'][0][0], 'passed': sections['[4]'][0][1]})
          PY
          # Every CI run is minutes old: nothing is older than one day, so the execute commits no change.
          python3 deploy/redact-agent-history.py --older-than-days 1
          python3 deploy/redact-agent-history.py --older-than-days 1 --execute | python3 -c 'import json,sys; v=json.load(sys.stdin); assert v["status"] == "redacted" and v["changed"] is False and v["gatewayTraces"]["keptNewer"] >= 3, v'
      - name: Record verification boundary
        if: always()
        run: echo 'Fictional catalog, no Google inference, no Cloudflare account or tunnel changes. AWS and external Access/Tunnel acceptance require separate execution.' >> "$GITHUB_STEP_SUMMARY"
      - name: Redacted disposable failure diagnostics
        if: failure()
        run: python3 deploy/tests/ci-diagnostics.py
      - name: Remove disposable CI project only
        if: always()
        run: docker compose -f deploy/compose.yaml -f deploy/compose.catalog.yaml -f deploy/compose.langflow.yaml -f deploy/compose.gateway.yaml down --volumes
